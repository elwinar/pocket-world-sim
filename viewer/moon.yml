$schema: https://moonrepo.dev/schemas/project.json

language: typescript
stack: frontend
layer: application

project:
  name: viewer
  description: "world viewer"

tasks:
  build:
    command: "pnpm vite build"
    deps:
      - "~:assetpack"
      - "~:typecheck"

  typecheck:
    command: "pnpm tsc"

  assetpack:
    command: "pnpm assetpack"
    inputs:
      - "assets/*"
    outputs:
      - "src/public/*"

  serve:
    command: "pnpm vite"
    deps:
      - "~:assetpack"
