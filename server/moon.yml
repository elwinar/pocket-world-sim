$schema: https://moonrepo.dev/schemas/project.json

language: go
stack: backend
layer: application

project:
  name: server
  description: "world simulation server"

tasks:
  build:
    command: "go build -o @out(0)"
    inputs:
      - "**/*.go"
      - "/go.mod"
    outputs:
      - "/bin/$project"
    deps:
      - "~:generate"
  generate:
    command: "go generate"
    inputs:
      - "**/*.go"
      - "/go.mod"
    outputs:
      - "**/*_string.go"
  lint:
    command: "golangci-lint run"
    inputs:
      - "**/*.go"
